<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수리의 전개도 탐험</title><meta name="description" content="수리와 함께 전개도를 천천히 접고 펼치며 만나는 점과 모서리, 평행과 수직을 발견해요."><link rel="stylesheet" href="style.css?v=unfold-speed-buttons"><meta property="og:type" content="website"><meta property="og:title" content="수리의 전개도 탐험"><meta property="og:description" content="접고 펼치며 만나는 점과 모서리, 평행과 수직을 찾아요."><meta property="og:image" content="https://eaglemath7.github.io/suri-nets/share-net.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="여섯 색의 정사각형으로 만든 정육면체 전개도"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://eaglemath7.github.io/suri-nets/share-net.png"><meta property="og:url" content="https://eaglemath7.github.io/suri-nets/"><link rel="canonical" href="https://eaglemath7.github.io/suri-nets/"></head><body>
<header><img class="game-brand-image" src="logo-games.svg?v=10" alt="독수리게임"><div>수리수리 마수리, 전개도야 접혀라 얍!</div></header>
<main><div class="titleline"><div><span class="eyebrow">수리의 수학놀이터</span><h1>전개도 탐험 <span>접으면, 만나!</span></h1></div><div class="solid-switch"><button id="cube" class="active">정육면체</button><button id="cuboid">직육면체</button></div></div>
<div class="workspace"><section class="viewer"><section class="card library"><div class="library-heading"><h2>정육면체 전개도 <b>11</b></h2><p>돌리거나 뒤집어서 같은 모양은 하나로 세어요.</p><select id="netFilter" aria-label="전개도 모양 분류"><option value="all">모든 모양</option><option value="4">4칸이 이어진 모양</option><option value="3">3칸이 이어진 모양</option><option value="2">2칸씩 붙은 모양</option></select></div><div id="netList"></div></section><div class="view-heading"><span><i></i> <b id="sceneTitle">바닥면을 골라 접어볼까요?</b></span><span id="foldBadge">펼친 모양</span></div><div class="canvas"><button id="toggleControls" class="controls-toggle" aria-expanded="true">크게 보기 ⛶</button><div id="basePrompt" class="base-prompt">바닥면을 선택해줘</div><div id="answerFeedback" class="answer-feedback" hidden role="status" aria-live="polite"><img src="suri-character.png" alt="수리"><strong id="answerCheer"></strong><span id="answerDetail"></span></div><svg id="scene" role="img" aria-label="접고 펼칠 수 있는 전개도 입체 모형"></svg><div class="line-key"><span>━ 바깥 테두리</span><span>┄ 접는 선</span></div><div class="canvas-note">드래그로 돌려보기 · 면을 눌러 선택</div><button id="home" aria-label="처음 시점">⌂</button></div>
<div id="diceTray" class="dice-tray" hidden><span id="diceHint"></span><div id="diceChoices"></div></div><div class="transport"><button id="play" class="primary">▶ 수리와 접기</button><button id="unfold">↶ 자동 펼치기</button><button id="unfoldStep">↶ 한 면씩 펼치기</button><button id="pause" aria-label="접기 펼치기 일시정지">Ⅱ</button><input id="speed" type="hidden" value="1.7"></div><div class="scrubber"><div id="speedButtons" class="speed-buttons" role="group" aria-label="접기 펼치기 속도"><button data-speed="0.6" aria-pressed="false">천천히</button><button data-speed="1" aria-pressed="false">보통</button><button data-speed="1.7" class="active" aria-pressed="true">빠름</button></div><span>펼침</span><input id="progress" type="range" min="0" max="1000" value="0" aria-label="접힘 정도"><span>완성</span></div><div class="suri-guide"><img src="suri-character.png" alt="수리"><p id="message" role="status" aria-live="polite">안녕! 바닥면으로 고정할 면을 선택하고 나와 함께 접어보자!</p></div></section>
<aside><div class="card activity"><div class="question" id="question" role="heading" aria-level="2"></div><div class="activity-heading"><h2>문제 선택</h2><button id="newQuestion" class="next-shape">↻ 다른 도형</button></div><div class="activities" id="activities"></div><div class="reference"><span id="referenceLabel"></span><button id="changeRef">기준 바꾸기</button></div><button id="check" class="primary wide" hidden>선택한 답 접어서 확인</button><button id="clearLinks" class="wide" hidden>연결 지우기</button><p class="tip" id="tip"></p></div>
<div class="card map-card"><div class="card-heading"><h2>펼쳐서 보면</h2><span>면 · 점 · 모서리 선택</span></div><svg id="flat" role="img" aria-label="선택할 수 있는 평면 전개도"></svg><div class="legend"><span><i class="reference-dot"></i>기준</span><span><i class="answer-dot"></i>만나는 부분 / 정답</span><span><i class="pick-dot"></i>내 선택</span></div></div>
</aside></div>
<footer>수리의 수학놀이터</footer></main><script src="geometry.js?v=dice-game"></script><script src="routing.js"></script><script src="point-routes.js"></script><script src="app.js?v=unfold-speed-buttons"></script><div id="diceGhost" class="dice-ghost" hidden></div></body></html>
